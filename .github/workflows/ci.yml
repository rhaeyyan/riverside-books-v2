name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: riverside
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Apply schema
        env:
          PGPASSWORD: password
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d riverside -f supabase/migrations/20260825210000_init_schema.sql
          psql -h localhost -U postgres -d riverside -f supabase/migrations/20260825220000_review_fixes.sql

      - name: Seed
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/riverside

        # Regenerates mock_data with run-time-relative timestamps (PRD §6.7).
        # Also guards the seed script itself: it exits non-zero if the data it
        # produces no longer meets the §6.7 minimums.
        run: uv run python -m scripts.seed --db

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer-app, staff-dashboard]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
